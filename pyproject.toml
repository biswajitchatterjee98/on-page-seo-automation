[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onpage-seo"
version = "0.5.0"
description = "On-page SEO automation: crawl, rules, LLM, dashboard, CMS approval queue"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "psycopg[binary]>=3.1",
  "streamlit>=1.32",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
onpage-seo = "onpage_seo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onpage_seo = ["storage/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
