[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onpage-seo"
version = "0.1.0"
description = "On-page SEO audit: crawl, rule score, JSON report (P0)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
dev = ["pytest>=7.4"]

[project.scripts]
onpage-seo = "onpage_seo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
