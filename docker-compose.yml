services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onpage
      POSTGRES_PASSWORD: onpage
      POSTGRES_DB: onpage_seo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onpage -d onpage_seo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DATABASE_URL: postgresql://onpage:onpage@db:5432/onpage_seo
      ONPAGE_SEO_API_TOKEN: ${ONPAGE_SEO_API_TOKEN:-dev-token-change-me}
      ONPAGE_SEO_SSRF_GUARD: "1"
      ONPAGE_SEO_THRESHOLDS_PATH: /app/config/thresholds.yaml
      ONPAGE_SEO_CRAWL_DELAY_SEC: "0.5"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8501"]
    environment:
      DATABASE_URL: postgresql://onpage:onpage@db:5432/onpage_seo
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-change-me}
      ONPAGE_SEO_THRESHOLDS_PATH: /app/config/thresholds.yaml
      ONPAGE_SEO_REGRESSION_POINTS: ${ONPAGE_SEO_REGRESSION_POINTS:-5}
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

volumes:
  pgdata:
  n8n_data:
